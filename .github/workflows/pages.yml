name: Refresh internship dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: '3-59/10 * * * *'
  workflow_dispatch:

concurrency:
  group: internship-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore previous collector state
        run: |
          if git fetch --no-tags origin refs/heads/feed-state; then
            git show FETCH_HEAD:jobs.json > site/data/jobs.json
          else
            if git ls-remote --exit-code origin refs/heads/feed-state; then
              exit 1
            else
              test "$?" -eq 2
            fi
          fi
      - name: Collect and validate job feed
        run: |
          status=0
          python3 collect.py || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::No source updates succeeded. Check source health."
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("site/data/jobs.json").read_text())
          assert data["last_success_at"], "No successful job collection is available"
          assert isinstance(data["sources"], dict)
          assert isinstance(data["jobs"], list)
          assert len({job["id"] for job in data["jobs"]}) == len(data["jobs"])
          PY
      - name: Save collector state
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          blob=$(git hash-object -w site/data/jobs.json)
          tree=$(printf '100644 blob %s\tjobs.json\n' "$blob" | git mktree)
          # A state-only branch keeps only the latest snapshot.
          revision=$(git commit-tree "$tree" -m 'Update internship feed state')
          git push --force origin "$revision:refs/heads/feed-state"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
